[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-eval-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1", "python-dotenv==1.1.1", "absl-py==2.3.1",
  "langdetect==1.0.9", "nltk==3.9.1", "immutabledict==4.2.1"
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
ai-eval = "ai_evals.cli:main"

[tool.setuptools]
packages = ["ai_evals", "ai_evals.core", "ai_evals.providers", "ai_evals.evals", "ai_evals.evals.ifeval"]
package-dir = {ai_evals = "."}
include-package-data = true

[tool.setuptools.package-data]
"ai_evals.evals.ifeval" = ["data/*.jsonl", "vendor/*", "vendor/instruction_following_eval/*", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
